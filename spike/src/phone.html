<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>phonepad spike</title>
<style>
  body { margin: 0; font: 16px system-ui, sans-serif; background: #111; color: #eee;
         touch-action: none; user-select: none; -webkit-user-select: none; }
  #status { padding: 16px; min-height: 3em; }
  #pad { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
  button { height: 28vh; font-size: 48px; border: 0; border-radius: 16px; background: #333; color: #fff; }
  button.on { background: #2a7; }
</style>
</head>
<body>
<div id="status" role="status">Connecting…</div>
<div id="pad"><button>A</button><button>B</button><button>X</button><button>Y</button></div>
<script type="module">
// Throwaway spike page: connects straight to the PC using only what the QR code carried.
const status = document.getElementById('status');
const show = text => (status.textContent = text);
addEventListener('unhandledrejection', e => show('Error: ' + e.reason));

const q = new URLSearchParams(location.hash.slice(1));
const [ip, port] = q.get('a').split(':'); // spike: IPv4 only
const fingerprint = q.get('f').match(/../g).join(':');

const pc = new RTCPeerConnection();
// Unordered and never retransmitted: a late gamepad packet is worse than a lost one.
const dc = pc.createDataChannel('pad', { negotiated: true, id: 0, ordered: false, maxRetransmits: 0 });
pc.onconnectionstatechange = () => pc.connectionState !== 'connected' && show('Connection: ' + pc.connectionState);

await pc.setLocalDescription(await pc.createOffer());
const mid = pc.localDescription.sdp.match(/a=mid:(\S+)/)[1];
// The PC's answer, built here from the QR data instead of fetched from a server.
await pc.setRemoteDescription({ type: 'answer', sdp: [
  'v=0', 'o=- 0 0 IN IP4 0.0.0.0', 's=-', 't=0 0',
  `a=group:BUNDLE ${mid}`, 'a=ice-lite',
  'm=application 9 UDP/DTLS/SCTP webrtc-datachannel', 'c=IN IP4 0.0.0.0',
  `a=mid:${mid}`, `a=ice-ufrag:${q.get('u')}`, `a=ice-pwd:${q.get('p')}`,
  `a=fingerprint:sha-256 ${fingerprint}`, 'a=setup:passive',
  'a=sctp-port:5000', 'a=max-message-size:16384',
  `a=candidate:1 1 udp 2130706431 ${ip} ${port} typ host`, 'a=end-of-candidates', '',
].join('\r\n') });

const rtts = [];
dc.onopen = () => {
  show('Connected');
  setInterval(() => dc.send('p ' + performance.now()), 200);
};
dc.onmessage = e => {
  rtts.push(performance.now() - parseFloat(e.data.slice(2)));
  if (rtts.length > 50) rtts.shift();
  const avg = rtts.reduce((a, b) => a + b) / rtts.length;
  show(`Connected · round trip ${rtts.at(-1).toFixed(1)} ms · avg ${avg.toFixed(1)} · best ${Math.min(...rtts).toFixed(1)}`);
};

for (const b of document.querySelectorAll('button')) {
  const send = down => {
    if (b.classList.contains('on') === down) return;
    b.classList.toggle('on', down);
    if (dc.readyState === 'open') dc.send(`${b.textContent} ${down ? 'pressed' : 'released'}`);
  };
  b.onpointerdown = () => send(true);
  b.onpointerup = b.onpointercancel = b.onpointerleave = () => send(false);
}
</script>
</body>
</html>
