<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>phonepad</title>
<style>
  :root { --p: #777; }  /* player color, set once the PC says which player we are */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee;
    font: 600 16px system-ui, sans-serif; touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; gap: 2vh; height: 100dvh;
    padding: max(2vh, env(safe-area-inset-top)) max(2vw, env(safe-area-inset-right)) max(2vh, env(safe-area-inset-bottom)) max(2vw, env(safe-area-inset-left)); }
  button { border: 0; border-radius: 14px; background: #2a2a2a; color: #fff; font: inherit; }
  .on { filter: brightness(1.8); transform: scale(.96); }

  #bar { flex: none; height: 10vh; display: flex; align-items: center; gap: 2vw; }
  #chip { background: var(--p); color: #000; padding: .3em .9em; border-radius: 99px; }
  #status { flex: 1; opacity: .6; font-weight: 400; white-space: nowrap; overflow: hidden; }
  #bar button { height: 100%; padding: 0 3vw; font-size: 13px; }

  main { flex: 1; min-height: 0; display: grid; gap: 2vh 2vw; }
  .col { display: grid; gap: 2vh; min-height: 0; }
  .row { display: flex; gap: 2vw; }
  .row > * { flex: 1; }
  .zone { position: relative; border-radius: 20px; background: #1a1a1a; overflow: hidden;
    display: grid; place-items: center; color: #555; font-weight: 400; }
  .hint { position: absolute; bottom: 2vh; font-size: 13px; }

  /* Face buttons, Xbox colors */
  .face { --s: min(16vh, 10vw); display: grid; place-content: center; gap: 1.5vh;
    grid-template: ". y ." var(--s) "x . b" var(--s) ". a ." var(--s) / var(--s) var(--s) var(--s); }
  .face button { border-radius: 50%; font-size: 24px; }
  .A { grid-area: a; background: #294; } .B { grid-area: b; background: #b33; }
  .X { grid-area: x; background: #26b; } .Y { grid-area: y; background: #a80; }

  /* Sticks */
  .base, .knob { position: absolute; translate: -50% -50%; border-radius: 50%; pointer-events: none; }
  .base { border: 2px solid var(--p); opacity: .5; }
  .knob { width: 13vh; height: 13vh; background: var(--p); }

  /* Racing */
  [data-wheel] svg { width: min(75%, 52vh); color: var(--p); pointer-events: none; }
  [data-pedals] { display: grid; grid-template-columns: 1fr 1.25fr; gap: 2vw; }
  .pedal { border-radius: 18px; display: grid; place-items: end center; padding-bottom: 3vh; font-size: 20px;
    background-image: repeating-linear-gradient(0deg, #0000 0 16px, #0004 16px 22px); }
  .brake { background-color: #6a2424; } .gas { background-color: #24683a; }
  .pedal.on { transform: scale(.97); filter: brightness(1.9); }

  /* D-pad */
  [data-dpad] svg { width: 80%; height: 85%; pointer-events: none; }
  [data-dpad] rect { fill: #333; }
  [data-dpad] rect.on { fill: var(--p); filter: none; transform: none; }

  .overlay { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center;
    gap: 3vh; padding: 4vh 4vw; background: #111f; font-size: 20px; }
  .overlay small { font-size: 13px; font-weight: 400; opacity: .6; }
  #picker { z-index: 3; }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2vw; width: min(96vw, 1100px); }
  .cards button { display: grid; gap: 1vh; padding: 3vh 2vw; text-align: left; border: 2px solid #0000; }
  .cards button.current { border-color: var(--p); }
  .cards b { font-size: 20px; }
  .cards small { font-size: 13px; line-height: 1.4; }
  #lost { z-index: 2; }
  #rotate { display: none; z-index: 1; }
  @media (orientation: portrait) {
    #rotate { display: grid; }
    .cards { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header id="bar">
  <span id="chip">P?</span><span id="status">Connecting…</span>
  <button id="mode">Mode ▾</button>
  <button data-b="0x0020">BACK</button>
  <button data-b="0x0010">START</button>
  <button id="fs" aria-label="Full screen">⛶</button>
</header>

<!-- Racing: the left thumb only steers, the right thumb owns both pedals. -->
<main data-mode="racing" style="grid-template-columns: 1fr 1fr">
  <div class="zone" data-wheel>
    <svg viewBox="-50 -50 100 100" aria-hidden="true">
      <circle r="43" fill="none" stroke="currentColor" stroke-width="9"/>
      <path d="M-40 6 H40 M0 6 V40" stroke="currentColor" stroke-width="9"/>
      <circle r="10" fill="currentColor"/><rect x="-3" y="-50" width="6" height="12" fill="#eee"/>
    </svg>
    <span class="hint">slide left / right anywhere here to steer</span>
  </div>
  <div class="col" style="grid-template-rows: 15vh 1fr">
    <div class="row">
      <button data-b="0x0100">LB</button><button data-b="0x0200">RB</button>
      <button data-b="0x4000">X</button><button data-b="0x8000">Y</button>
      <button data-b="0x2000">B</button><button data-b="0x1000">A</button>
    </div>
    <div data-pedals>
      <div class="pedal brake">BRAKE</div><div class="pedal gas">GAS</div>
    </div>
  </div>
</main>

<!-- Party: as few things to find as possible. -->
<main data-mode="party" style="grid-template-columns: 1.2fr 1fr" hidden>
  <div class="zone" data-stick="l">touch anywhere here &amp; drag to move</div>
  <div class="col" style="grid-template-rows: 14vh 1fr">
    <div class="row"><button data-b="0x0100">LB</button><button data-b="0x0200">RB</button></div>
    <div class="face" style="--s: min(21vh, 12vw)">
      <button class="A" data-b="0x1000">A</button><button class="B" data-b="0x2000">B</button>
      <button class="X" data-b="0x4000">X</button><button class="Y" data-b="0x8000">Y</button>
    </div>
  </div>
</main>

<!-- Retro: D-pad instead of a stick. -->
<main data-mode="retro" style="grid-template: 14vh 1fr / 1fr 1fr" hidden>
  <div class="row"><button data-axis="lt">LT</button><button data-b="0x0100">LB</button></div>
  <div class="row"><button data-b="0x0200">RB</button><button data-axis="rt">RT</button></div>
  <div class="zone" data-dpad></div>
  <div class="face">
    <button class="A" data-b="0x1000">A</button><button class="B" data-b="0x2000">B</button>
    <button class="X" data-b="0x4000">X</button><button class="Y" data-b="0x8000">Y</button>
  </div>
</main>

<!-- Full: every button on an Xbox pad. -->
<main data-mode="full" style="grid-template: 13vh 1fr / 1fr 1fr 1fr" hidden>
  <div class="row" style="grid-column: 1 / -1">
    <button data-axis="lt">LT</button><button data-b="0x0100">LB</button>
    <button data-b="0x0040">L3</button><button data-b="0x0080">R3</button>
    <button data-b="0x0200">RB</button><button data-axis="rt">RT</button>
  </div>
  <div class="col" style="grid-template-rows: 2fr 3fr">
    <div class="zone" data-dpad></div>
    <div class="zone" data-stick="l">left stick</div>
  </div>
  <div class="zone" data-stick="r">right stick</div>
  <div class="face">
    <button class="A" data-b="0x1000">A</button><button class="B" data-b="0x2000">B</button>
    <button class="X" data-b="0x4000">X</button><button class="Y" data-b="0x8000">Y</button>
  </div>
</main>

<div id="picker" class="overlay">
  Pick a controller
  <div class="cards">
    <button data-pick="racing"><b>Racing</b><small>Steering wheel on the left, gas &amp; brake on the right.<br>BeamNG, Euro Truck, Forza</small></button>
    <button data-pick="party"><b>Party</b><small>One big stick, four big buttons.<br>Overcooked, Gang Beasts, Moving Out</small></button>
    <button data-pick="retro"><b>Retro</b><small>D-pad and buttons.<br>Platformers, fighting, emulators</small></button>
    <button data-pick="full"><b>Full pad</b><small>Two sticks, D-pad, every button.<br>Everything else</small></button>
  </div>
  <small>Android goes full screen. On iPhone, turn the phone sideways.</small>
</div>
<div id="lost" class="overlay" hidden>Disconnected<small>Tap to reconnect</small></div>
<div id="rotate" class="overlay">Turn your phone sideways</div>

<script type="module">
// Throwaway spike page: a gamepad that talks straight to the PC using only what the QR code carried.
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const show = text => ($('#status').textContent = text);
addEventListener('unhandledrejection', e => show('Error: ' + e.reason));
addEventListener('contextmenu', e => e.preventDefault());
const COLORS = ['#777', '#4a9eff', '#ff5a5a', '#3ecf6e', '#ffc93c']; // index = player number
/** Thumb travel for full steering lock, as a share of screen width. Tune to taste. */
const STEER_RANGE = 0.2;

// ---- Connection ----
const q = new URLSearchParams(location.hash.slice(1));
const [ip, port] = q.get('a').split(':'); // spike: IPv4 only
const fingerprint = q.get('f').match(/../g).join(':');
const pc = new RTCPeerConnection();
// Unordered and never retransmitted: a late gamepad packet is worse than a lost one.
const dc = pc.createDataChannel('pad', { negotiated: true, id: 0, ordered: false, maxRetransmits: 0 });
await pc.setLocalDescription(await pc.createOffer());
const mid = pc.localDescription.sdp.match(/a=mid:(\S+)/)[1];
// The PC's answer, built here from the QR data instead of fetched from a server.
await pc.setRemoteDescription({ type: 'answer', sdp: [
  'v=0', 'o=- 0 0 IN IP4 0.0.0.0', 's=-', 't=0 0',
  `a=group:BUNDLE ${mid}`, 'a=ice-lite',
  'm=application 9 UDP/DTLS/SCTP webrtc-datachannel', 'c=IN IP4 0.0.0.0',
  `a=mid:${mid}`, `a=ice-ufrag:${q.get('u')}`, `a=ice-pwd:${q.get('p')}`,
  `a=fingerprint:sha-256 ${fingerprint}`, 'a=setup:passive',
  'a=sctp-port:5000', 'a=max-message-size:16384',
  `a=candidate:1 1 udp 2130706431 ${ip} ${port} typ host`, 'a=end-of-candidates', '',
].join('\r\n') });

pc.onconnectionstatechange = () => {
  if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) $('#lost').hidden = false;
};
$('#lost').onclick = () => location.reload();
const rtts = [];
dc.onopen = () => {
  show('Connected');
  setInterval(send, 100); // heartbeat: repairs lost packets, tells the PC we're still here
  setInterval(() => dc.readyState === 'open' && dc.send('p ' + performance.now()), 500);
};
dc.onmessage = e => {
  const [, sent, player] = e.data.split(' ');
  rtts.push(performance.now() - sent);
  if (rtts.length > 20) rtts.shift();
  show(`${rtts.at(-1).toFixed(0)} ms (avg ${(rtts.reduce((a, b) => a + b) / rtts.length).toFixed(0)})`);
  $('#chip').textContent = 'P' + player;
  document.documentElement.style.setProperty('--p', COLORS[player] ?? COLORS[0]);
};

// ---- Gamepad state, in XInput's own layout so the PC copies it straight in ----
const state = { buttons: 0, lt: 0, rt: 0, lx: 0, ly: 0, rx: 0, ry: 0 };
let seq = 0;
function send() {
  if (dc.readyState !== 'open') return;
  const v = new DataView(new ArrayBuffer(14));
  v.setUint16(0, seq = (seq + 1) & 0xffff, true);
  v.setUint16(2, state.buttons, true);
  v.setUint8(4, state.lt);
  v.setUint8(5, state.rt);
  [state.lx, state.ly, state.rx, state.ry].forEach((n, i) => v.setInt16(6 + i * 2, n, true));
  dc.send(v.buffer);
}
function neutral() {
  Object.assign(state, { buttons: 0, lt: 0, rt: 0, lx: 0, ly: 0, rx: 0, ry: 0 });
  $$('.on').forEach(el => el.classList.remove('on'));
  $$('.base, .knob').forEach(el => (el.hidden = true));
  $$('[data-wheel] svg').forEach(el => (el.style.rotate = '0deg'));
  send();
}
document.addEventListener('visibilitychange', () => document.hidden && neutral());

// ---- Controls ----
/** Follows one finger on `el` from touch to release; other fingers are ignored. */
function drag(el, move, end) {
  let id = null, origin;
  el.onpointerdown = e => {
    if (id !== null) return;
    id = e.pointerId;
    el.setPointerCapture(id);
    origin = { x: e.clientX, y: e.clientY };
    navigator.vibrate?.(8);
    move(e, origin);
  };
  el.onpointermove = e => e.pointerId === id && move(e, origin);
  el.onpointerup = el.onpointercancel = e => {
    if (e.pointerId !== id) return;
    id = null;
    end();
  };
}
const clamp = v => Math.max(-1, Math.min(1, v));
const place = (zone, el, x, y) => {
  const z = zone.getBoundingClientRect();
  el.style.left = x - z.left + 'px';
  el.style.top = y - z.top + 'px';
};

for (const el of $$('[data-b]')) {
  const bit = Number(el.dataset.b);
  drag(el, () => { el.classList.add('on'); state.buttons |= bit; send(); },
           () => { el.classList.remove('on'); state.buttons &= ~bit; send(); });
}
for (const el of $$('[data-axis]')) { // LT/RT as plain buttons: fully pressed while held
  drag(el, () => { el.classList.add('on'); state[el.dataset.axis] = 255; send(); },
           () => { el.classList.remove('on'); state[el.dataset.axis] = 0; send(); });
}

// Floating stick: centered wherever the thumb lands.
for (const zone of $$('[data-stick]')) {
  const [x, y] = zone.dataset.stick === 'l' ? ['lx', 'ly'] : ['rx', 'ry'];
  zone.insertAdjacentHTML('beforeend', '<div class="base" hidden></div><div class="knob" hidden></div>');
  const base = zone.querySelector('.base'), knob = zone.querySelector('.knob');
  drag(zone, (e, o) => {
    const R = Math.min(innerWidth, innerHeight) * 0.2; // full deflection this far from where the thumb landed
    let dx = e.clientX - o.x, dy = e.clientY - o.y;
    const d = Math.hypot(dx, dy);
    if (d > R) { dx *= R / d; dy *= R / d; }
    state[x] = Math.round(dx / R * 32767);
    state[y] = Math.round(-dy / R * 32767);
    base.style.width = base.style.height = 2 * R + 'px';
    place(zone, base, o.x, o.y);
    place(zone, knob, o.x + dx, o.y + dy);
    base.hidden = knob.hidden = false;
    send();
  }, () => {
    state[x] = state[y] = 0;
    base.hidden = knob.hidden = true;
    send();
  });
}

// Steering wheel: left/right only, measured from wherever the thumb lands, so there's nothing to aim for.
for (const zone of $$('[data-wheel]')) {
  const wheel = zone.querySelector('svg');
  const steer = v => { state.lx = Math.round(v * 32767); wheel.style.rotate = v * 120 + 'deg'; send(); };
  drag(zone, (e, o) => steer(clamp((e.clientX - o.x) / (innerWidth * STEER_RANGE))), () => steer(0));
}

// Pedals: one thumb slides between brake and gas without lifting, like a foot.
for (const zone of $$('[data-pedals]')) {
  const [brake, gas] = zone.children;
  const press = p => {
    state.lt = p === brake ? 255 : 0;
    state.rt = p === gas ? 255 : 0;
    brake.classList.toggle('on', p === brake);
    gas.classList.toggle('on', p === gas);
    send();
  };
  drag(zone, e => press(e.clientX < gas.getBoundingClientRect().left ? brake : gas), () => press(null));
}

// D-pad: eight equal 45° slices around the cross's center, slide between them freely.
const DIRS = { up: 0x0001, down: 0x0002, left: 0x0004, right: 0x0008 };
for (const zone of $$('[data-dpad]')) {
  zone.innerHTML = `<svg viewBox="-3 -3 6 6" aria-hidden="true"><rect x="-1" y="-1" width="2" height="2"/>
    <rect data-dir="up" x="-1" y="-3" width="2" height="2" rx=".3"/><rect data-dir="down" x="-1" y="1" width="2" height="2" rx=".3"/>
    <rect data-dir="left" x="-3" y="-1" width="2" height="2" rx=".3"/><rect data-dir="right" x="1" y="-1" width="2" height="2" rx=".3"/></svg>`;
  const arms = zone.querySelectorAll('[data-dir]');
  const set = bits => {
    state.buttons = (state.buttons & ~0x000f) | bits;
    arms.forEach(a => a.classList.toggle('on', (bits & DIRS[a.dataset.dir]) !== 0));
    send();
  };
  drag(zone, e => {
    const r = zone.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy), t = d * 0.38; // 0.38 ≈ sin 22.5°
    if (d < Math.min(r.width, r.height) * 0.08) return set(0); // dead center
    set((dx > t && DIRS.right) | (dx < -t && DIRS.left) | (dy > t && DIRS.down) | (dy < -t && DIRS.up));
  }, () => set(0));
}

// ---- Modes ----
function setMode(name) {
  for (const m of $$('main')) m.hidden = m.dataset.mode !== name;
  for (const c of $$('[data-pick]')) c.classList.toggle('current', c.dataset.pick === name);
  $('#mode').textContent = $(`[data-pick="${name}"] b`).textContent + ' ▾';
  localStorage.mode = name; // remembered per phone
  neutral(); // nothing stays pressed from the previous layout
}
for (const card of $$('[data-pick]')) {
  card.onclick = () => { setMode(card.dataset.pick); $('#picker').hidden = true; fullscreen(); };
}
$('#mode').onclick = () => ($('#picker').hidden = false);
setMode($(`[data-pick="${localStorage.mode}"]`) ? localStorage.mode : 'racing');

// ---- Full screen (Android; iPhone Safari doesn't allow it for pages) ----
async function fullscreen() {
  try {
    await document.documentElement.requestFullscreen?.({ navigationUI: 'hide' });
    await screen.orientation?.lock?.('landscape');
  } catch {}
}
$('#fs').onclick = fullscreen;
</script>
</body>
</html>
