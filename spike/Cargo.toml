[package]
name = "phonepad-spike"
version = "0.1.0"
edition = "2024"

# Throwaway spike: proves phone browser -> PC WebRTC with no signaling server.
[dependencies]
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# rust-crypto: pure Rust, so no C toolchain or OpenSSL needed to build.
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
