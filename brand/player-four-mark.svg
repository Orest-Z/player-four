<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Player Four: a real QR version-1 grid (21x21 modules, 12 px each, from 24,24).
       Three finder eyes = players 1-3; the corner where a QR code has nothing = player 4's button. -->
  <rect width="300" height="300" rx="66" fill="#15151A"/>
  <defs>
    <g id="eye"><rect width="84" height="84" rx="14"/><rect x="12" y="12" width="60" height="60" rx="7" fill="#15151A"/><rect x="24" y="24" width="36" height="36" rx="6"/></g>
  </defs>
  <use href="#eye" x="24" y="24" fill="#3B82F6"/>
  <use href="#eye" x="192" y="24" fill="#F97316"/>
  <use href="#eye" x="24" y="192" fill="#A855F7"/>
  <!-- Timing patterns: the dotted lines every real QR code runs between its eyes. -->
  <g fill="#F3EEE3"><rect x="120" y="96" width="12" height="12" rx="2.5"/><rect x="144" y="96" width="12" height="12" rx="2.5"/><rect x="168" y="96" width="12" height="12" rx="2.5"/>
    <rect x="96" y="120" width="12" height="12" rx="2.5"/><rect x="96" y="144" width="12" height="12" rx="2.5"/><rect x="96" y="168" width="12" height="12" rx="2.5"/></g>
  <!-- Player four: mid-press, just joined. -->
  <circle cx="234" cy="241" r="42" fill="#B7860A"/>
  <circle cx="234" cy="232" r="42" fill="#EAB308"/>
  <g stroke="#EAB308" stroke-width="10" stroke-linecap="round"><path d="M172 188 158 178M187 168 180 152M163 210 146 209"/></g>
</svg>
